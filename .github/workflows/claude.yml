name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Default for every job; jobs widen it only where they need to.
permissions:
  contents: read

jobs:
  claude:
    # Two gates, both required:
    #  1. the text mentions @claude
    #  2. the author has write access to this repo.
    # author_association is computed by GitHub and cannot be spoofed; only
    # OWNER / MEMBER / COLLABORATOR imply write access. The coding agent's
    # GitHub App, tuhokuutio[bot], can push here but is always NONE, so it is
    # named by login, which cannot be spoofed either. Claude answers as
    # claude[bot], which is not listed, so its replies never trigger a run.
    # Without this gate anyone who can comment could spend this repo's runner
    # minutes and the Claude quota.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event_name == 'issue_comment' && github.event.comment.author_association
          || github.event_name == 'pull_request_review_comment' && github.event.comment.author_association
          || github.event_name == 'pull_request_review' && github.event.review.author_association
          || github.event.issue.author_association) ||
        (github.event_name == 'issue_comment' && github.event.comment.user.login
          || github.event_name == 'pull_request_review_comment' && github.event.comment.user.login
          || github.event_name == 'pull_request_review' && github.event.review.user.login
          || github.event.issue.user.login) == 'tuhokuutio[bot]'
      )
    # The self-hosted pool, as check.yml's RUNNER POOL. The if:
    # above admits only this repository's writers, but on a review or a
    # review comment the checkout below is the PR's merge commit, so a
    # fork's ./.github/actions/claude-otel would run. Such a run goes to
    # GitHub-hosted runners: a positive check, so an unknown head repository
    # counts as outside. Issue comments check out the default branch.
    runs-on: ${{ (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Reports the session's tokens and equivalent cost to the ioio telemetry
      # collector as device-scry-ci. Turns itself off, without failing the
      # run, if the secrets or Keycloak are unavailable.
      - name: Claude telemetry settings
        id: otel
        uses: ./.github/actions/claude-otel
        with:
          client-id: ${{ secrets.CLAUDE_OTEL_CLIENT_ID }}
          client-secret: ${{ secrets.CLAUDE_OTEL_CLIENT_SECRET }}
          device-name: scry-ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ steps.otel.outputs.settings }}
          # The action refuses runs started by a bot unless it is listed.
          allowed_bots: 'tuhokuutio[bot]'

          # Lets Claude read CI results on PRs.
          additional_permissions: |
            actions: read

          # Read-only allowlist mirroring the code-review plugin's gh commands, plus
          # inline PR comments. No build/test commands: those would run PR code
          # with the bot's token, and github_ci already exposes CI results.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          claude_args: '--model claude-opus-5-5 --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),mcp__github_inline_comment__create_inline_comment"'
